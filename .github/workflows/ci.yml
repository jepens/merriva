name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Build tanpa NEXT_PUBLIC_SENTRY_DSN → path config polos ikut teruji,
      # menangkap regresi build standalone sebelum deploy Easypanel.
      - name: Build
        run: pnpm build

      # Gerbang anggaran bundle (AUDIT-2026-09-04 PER-14). Sejak Next 16 +
      # Turbopack tak lagi mencetak tabel First Load JS, anggaran di
      # docs/THEME-PORTING.md §4 berhenti bisa ditegakkan — dan itulah sebabnya
      # /[slug] diam-diam tumbuh jadi 116 berkas font dari KESEPULUH tema.
      # Membaca manifest resmi Next; harus SESUDAH build.
      - name: Anggaran bundle
        run: pnpm bundle:report --check
