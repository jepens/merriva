name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Typecheck, Test
    runs-on: ubuntu-latest
    # Menimpa `contents: read` tingkat workflow (blok job MENGGANTI, bukan
    # menambah). `pull-requests: read` ada karena gitleaks-action memanggil
    # `GET /repos/{o}/{r}/pulls/{n}/commits` untuk memindai commit MILIK PR
    # saja. Tanpa izin itu jawabannya `403 Resource not accessible by
    # integration` dan job gagal SEBELUM lint/typecheck/test sempat jalan —
    # jadi kegagalannya tampak seperti "dependensinya rusak" padahal kodenya
    # tak pernah disentuh. Seluruh PR Dependabot merah karena ini (6 PR, 14 Okt
    # 2026), termasuk yang membawa patch keamanan.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Major versi yang berjalan di runtime Node 24 (Node 20 deprecated di
      # runner GitHub). `cache: pnpm` wajib eksplisit: sejak setup-node v6
      # cache otomatis hanya untuk npm.
      - uses: actions/checkout@v7
        with:
          # WAJIB untuk gitleaks (contoh resmi README-nya juga memakai 0).
          # Bawaan checkout adalah klon DANGKAL (depth 1), sedangkan pada event
          # `pull_request` gitleaks memindai rentang commit PR-nya:
          #   gitleaks detect --log-opts=... <sha>^..<sha>
          # Tanpa induknya di klon, git menjawab
          #   fatal: ambiguous argument '<sha>^..<sha>': unknown revision
          # dan aksinya berhenti dengan "failed to scan Git repository".
          # Gejalanya menyesatkan dua kali: job merah di langkah pemindaian
          # rahasia padahal tak ada rahasia, dan lint/typecheck/test di
          # bawahnya tak pernah jalan sehingga PR tampak "rusak".
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Fixture test yang memang berbentuk kunci ditandai `// gitleaks:allow`
      # PER BARIS, bukan lewat allowlist path: mematikan aturan untuk seluruh
      # `tests/` berarti JWT sungguhan bisa lolos di fixture kelak, dan setiap
      # fixture baru jadi tak perlu keputusan sadar lagi.
      #
      # Secret yang ter-commit tak bisa "dibatalkan" — sejarah git permanen, dan
      # SUPABASE_SERVICE_ROLE_KEY mem-bypass RLS di SELURUH tabel. Sejarah repo
      # ini bersih hari ini (AUDIT-2026-10-01); yang belum ada adalah mekanisme
      # yang menjaganya tetap bersih. Gratis untuk repo privat.
      # v3, bukan v2: v2 berhenti didukung 16 September 2026 (tanggal yang SUDAH
      # lewat) dan runner kini memaksanya ke Node 24 sambil mencetak peringatan
      # deprecation tiap jalan. v3 menurut rilisnya tanpa perubahan input,
      # output, maupun perilaku; syaratnya `actions/checkout` >= v6 — di sini
      # sudah v7.
      - name: Pindai secret (gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Komentar PR dimatikan agar langkah ini tak pernah butuh izin TULIS.
          # Izin itu SEBENARNYA bisa diberikan — sejak Okt 2021 run yang dipicu
          # Dependabot menghormati blok `permissions:` (bawaannya read-only;
          # contoh auto-merge GitHub sendiri meminta `pull-requests: write`).
          # Tidak diberikan karena tak sepadan: menaikkan token ke TULIS pada
          # job yang menjalankan kode dependensi pihak ketiga, demi komentar bot
          # yang hanya muncul ketika gitleaks menemukan sesuatu — padahal saat
          # itu job-nya sudah merah dan log-nya sudah menyebut berkas & baris.
          GITLEAKS_ENABLE_COMMENTS: false

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # Pra-render statis `/`, `/harga`, `/tema` membaca katalog Supabase saat
      # build (`catalog.ts` sengaja GAGAL-KERAS agar harga kosong tak pernah
      # ter-cache — SPEC §4.1). Tanpa env ini Build merah sejak 30 Jul 2026 dan
      # langkah sesudahnya ter-skip diam-diam (DECISIONS #36). URL & anon key
      # memang publik by design (dilindungi RLS) — BUKAN service role.
      # Gagal cepat dengan pesan jelas bila secret belum dipasang.
      - name: Cek secret build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PELAKU: ${{ github.actor }}
        run: |
          kosong=""
          for v in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY; do
            if [ -z "${!v}" ]; then kosong="$kosong $v"; fi
          done
          if [ -z "$kosong" ]; then exit 0; fi

          # Sebabnya BEDA tergantung siapa yang memicu, dan pesan yang salah
          # mengirim orang ke tab setelan yang keliru. Run Dependabot TIDAK
          # pernah menerima GitHub Actions secrets — ia memakai Dependabot
          # secrets yang tersimpan terpisah. Tanpa pembedaan ini, PR Dependabot
          # gagal dengan "Secret belum di-set" padahal secret-nya ADA; itulah
          # topeng ketiga yang membuat enam PR tampak rusak (15 Okt 2026).
          if [ "$PELAKU" = "dependabot[bot]" ]; then
            echo "::error::Run Dependabot tidak menerima GitHub Actions secrets — ia memakai DEPENDABOT secrets yang terpisah. Tambahkan${kosong} di Settings > Secrets and variables > Dependabot (nilainya sama; keduanya publik by design, dilindungi RLS — BUKAN service role). Sampai itu, Build dan Anggaran bundle TIDAK terverifikasi pada PR ini; Lint, Typecheck, dan Test di atas tetap sahih."
          else
            echo "::error::Secret${kosong} belum di-set di GitHub Actions (Settings > Secrets and variables > Actions). Lihat DECISIONS #36."
          fi
          exit 1

      # DSN BONEKA, bukan kosong — dan bukan secret: nilainya literal di sini,
      # tak pernah mengirim apa pun (tanpa SENTRY_AUTH_TOKEN unggah sourcemap
      # mati, dan `telemetry: false` sudah terpasang di next.config.ts).
      #
      # Sampai 21 Okt 2026 build ini SENGAJA tanpa DSN, dengan alasan "path
      # config polos ikut teruji". Akibatnya dua hal, keduanya terukur:
      #   1. cabang `withSentryConfig` (next.config.ts) TIDAK PERNAH dieksekusi
      #      gerbang mana pun — yang pertama menjalankannya adalah produksi;
      #   2. gerbang anggaran di bawah mengukur BENTUK YANG BUKAN PRODUKSI.
      #      Diukur dengan `docker build` bersebelahan: SHELL 133,9 KB gz tanpa
      #      DSN vs 181,9 KB gz dengan DSN — +48 KB gz di SETIAP halaman,
      #      termasuk halaman undangan tamu. CI hijau, produksi 36% lebih berat.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SENTRY_DSN: https://0@o0.ingest.us.sentry.io/0
        run: pnpm build

      # Gerbang anggaran bundle (AUDIT-2026-09-04 PER-14). Sejak Next 16 +
      # Turbopack tak lagi mencetak tabel First Load JS, anggaran di
      # docs/THEME-PORTING.md §4 berhenti bisa ditegakkan — dan itulah sebabnya
      # /[slug] diam-diam tumbuh jadi 116 berkas font dari KESEPULUH tema.
      # Membaca manifest resmi Next; harus SESUDAH build.
      - name: Anggaran bundle
        run: pnpm bundle:report --check

  # pgTAP menjalankan RPC & RLS SUNGGUHAN di Postgres — kelas cacat yang tak
  # terjangkau unit test, yang me-MOCK setiap RPC. Dipisah dari `verify` dan
  # TIDAK menahannya: stack lokal perlu ~2 menit untuk hidup, dan kegagalan
  # menyalakan Docker tak boleh menyamar jadi kode yang rusak.
  #
  # Alasan jobnya ada: `admin_refund_order` sempat lolos review, typecheck, dan
  # seluruh unit test dengan bug yang membuat SETIAP refund add-on gagal
  # (parameter OUT menaungi nama kolom). Hanya menjalankannya yang menemukan itu.
  db:
    name: Test DB (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # Hanya layanan yang dibutuhkan pgTAP — studio/realtime/storage tak perlu
      # dan memangkas waktu nyala secara berarti.
      - name: Nyalakan Postgres lokal
        run: supabase db start

      - name: pgTAP
        run: supabase test db

  # Gerbang deploy (AUDIT-2026-10-01, gelombang C).
  #
  # MASALAHNYA: Easypanel auto-build saat push ke `main` (DEPLOYMENT.md §Build),
  # dan webhook-nya berjalan PARALEL dengan CI — bukan sesudahnya. Commit yang
  # CI-nya merah karena itu sudah hidup di produksi beberapa menit kemudian, dan
  # satu-satunya yang mengetahuinya adalah orang yang mengecek `gh run list`
  # SETELAHNYA. Itu deteksi, bukan pencegahan.
  #
  # Gerbang yang sebenarnya cocok — required status check — terkunci di balik
  # GitHub Pro untuk repo privat: `gh api repos/:owner/:repo/branches/main/protection`
  # menjawab 403 "Upgrade to GitHub Pro or make this repository public".
  #
  # Karena itu PEMICUNYA yang dipindah, bukan gerbangnya yang ditambahkan:
  # Easypanel mengawasi branch `production`, dan HANYA job ini yang
  # menggerakkannya — setelah `verify` DAN `db` hijau. CI merah = `production`
  # sekadar tak bergerak, dan produksi tetap pada versi hijau terakhir.
  #
  # ⚠ Belum berlaku sampai pemilik mengubah branch yang diawasi Easypanel dari
  # `main` ke `production` (LAUNCH-CHECKLIST Fase 1). Sebelum itu job ini hanya
  # memelihara cermin yang tak dipakai siapa pun — aman, tetapi bukan gerbang.
  promote:
    name: Promosikan ke production
    needs: [verify, db]
    # WAJIB. Tanpa penjaga ini job akan ikut jalan pada setiap PR hijau
    # (termasuk Dependabot), dan pada event `pull_request` `github.sha` adalah
    # merge commit yang BERINDUK `main` — jadi fast-forward-nya SAH dan
    # BERHASIL. Hasilnya: kode yang belum di-merge naik ke produksi otomatis.
    # Itu memperluas celah, bukan menutupnya.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # Menimpa `contents: read` tingkat workflow — job ini perlu mendorong.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Job punya workspace sendiri; fast-forward butuh riwayatnya.
          fetch-depth: 0

      # TANPA --force, sengaja: server GitHub menolak bila bukan fast-forward,
      # sehingga `production` tak pernah bisa mundur atau bercabang diam-diam.
      - name: Fast-forward `production` ke commit yang hijau
        run: git push origin ${{ github.sha }}:refs/heads/production
